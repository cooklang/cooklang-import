[package]
name = "cooklang-import"
version = "0.10.0"
edition = "2021"
description = "A tool for importing recipes into Cooklang format"
license = "MIT"
repository = "https://github.com/cooklang/cooklang-import"
documentation = "https://docs.rs/cooklang-import"
homepage = "https://github.com/cooklang/cooklang-import"
default-run = "cooklang-import"

[lib]
name = "cooklang_import"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "cooklang-import"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[features]
default = ["native"]
# Everything that needs the network, an async runtime or an LLM: fetchers,
# converters, OCR, config, the builder API and the CLI. Off, only the structured
# extractors, the Recipe model and the YAML helpers are left, which is what the
# wasm build ships (see src/extract.rs).
native = [
    "dep:async-trait",
    "dep:base64",
    "dep:config",
    "dep:env_logger",
    "dep:reqwest",
    "dep:thiserror",
    "dep:tokio",
    "dep:whatlang",
]
uniffi-cli = ["uniffi", "uniffi/cli"]
uniffi = ["dep:uniffi", "native"]

[dependencies]
async-trait = { version = "0.1.83", optional = true }
base64 = { version = "0.23", optional = true }
# Only enable toml format - saves ~300KB from yaml/json5/ron/ini parsers
config = { version = "0.15", default-features = false, features = ["toml"], optional = true }
# Disable default features (regex, color) - saves ~430KB from regex stack
env_logger = { version = "0.11", default-features = false, optional = true }
html-escape = "0.2"
log = "0.4"
# Use rustls with bundled Mozilla CA certs - more reliable across platforms (including Android)
# gzip/brotli/deflate are not optional niceties: some CDNs answer with
# `content-encoding: gzip` even when the request sends no `Accept-Encoding`
# (hostthetoast.com, 2026-09-06), and an undecoded body reaches the HTML parser as
# mojibake. Enabling them also makes reqwest advertise Accept-Encoding, which is one
# of the browser headers WAFs look for.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "gzip", "brotli", "deflate"], optional = true }
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { version = "2.0", optional = true }
whatlang = { version = "0.18", optional = true }
# Only enable required tokio features - saves ~100KB
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs"], optional = true }
uniffi = { version = "0.28", optional = true }
serde_yaml = "0.9"

[dev-dependencies]
flate2 = "1.1"
mockito = "1.5.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "test-util"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"], optional = true }

# Release profile optimizations for smaller binaries
# Note: LTO disabled - it embeds LLVM bitcode in static libraries, increasing size.
# The final app's linker can apply LTO when linking against this library.
[profile.release]
opt-level = "z"         # Optimize for size
panic = "abort"         # Smaller binary, no unwinding
